<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Escritorio Privado</title>
    <style>
        :root { --accent: #00d2ff; }
        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: #0f172a; color: white;
            display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;
        }
        /* Pantalla de Bloqueo */
        #lock-screen {
            text-align: center; z-index: 100; transition: 0.5s;
        }
        input {
            padding: 12px; border-radius: 10px; border: none; outline: none;
            background: rgba(255,255,255,0.1); color: white; text-align: center; font-size: 1.1rem;
        }
        /* El Escritorio */
        #desktop {
            display: none; width: 90%; max-width: 1000px;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 30px;
        }
        .app {
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; color: white; transition: 0.3s;
        }
        .app:hover { transform: translateY(-5px); filter: drop-shadow(0 0 10px var(--accent)); }
        .app img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- PANTALLA DE ACCESO -->
    <div id="lock-screen">
        <h2 id="msg">Introduce tu Clave</h2>
        <input type="password" id="pass" placeholder="••••" onkeypress="checkPass(event)">
    </div>

    <!-- ESCRITORIO -->
    <div id="desktop">
        <!-- AÑADE TUS APPS AQUÍ -->
        <a href="https://google.com" target="_blank" class="app">
            <img src="https://www.google.com/favicon.ico">
            <span>Buscador</span>
        </a>
       
        <a href="URL_DE_LA_WEB" target="_blank" class="app">
    <img src="https://gemini.google.com/">
    <span>IA</span>
</a>
        <a href="https://github.com" target="_blank" class="app">
            <img src="https://github.com/favicon.ico">
            <span>GitHub</span>
        </a>

        <a href="https://youtube.com" target="_blank" class="app">
            <img src="https://www.youtube.com/favicon.ico">
            <span>YouTube</span>
        </a>
    </div>

    <script>
        // CAMBIA "1234" POR TU CONTRASEÑA REAL
        const CLAVE_CORRECTA = "prueba1"; 

        function checkPass(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('pass').value;
                if (input === CLAVE_CORRECTA) {
                    document.getElementById('lock-screen').classList.add('hidden');
                    document.getElementById('desktop').style.display = 'grid';
                } else {
                    document.getElementById('msg').innerText = "❌ Incorrecto";
                    document.getElementById('pass').value = "";
                }
            }
        }
    </script>
</body>
</html>
